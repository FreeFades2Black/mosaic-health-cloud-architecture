name: Continuous Integration & Architecture Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-validation-gate:
    name: OCaml Gatekeeper Manifest Validation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Pull OCaml Event Engine Gatekeeper
        run: |
          docker pull ghcr.io/freefades2black/ocaml-event-engine:latest || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Manifest Validation Gate
        run: |
          python scripts/validate_manifests_gatekeeper.py

  architecture-tests:
    name: Architecture & Governance Validation Tests
    needs: manifest-validation-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short
