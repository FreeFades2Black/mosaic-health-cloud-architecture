# ==============================================================================
# GITHUB ACTIONS: MOSAIC HEALTH CLOUD ARCHITECTURE PORTAL CI/CD
# Runs automated testing & builds/deploys MkDocs site to GitHub Pages
# ==============================================================================

name: Deploy Architecture Portal to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-validate:
    name: Run Architecture & Governance Validation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Validate MkDocs Build
        run: |
          mkdocs build --strict

  deploy-pages:
    name: Build and Deploy to GitHub Pages
    needs: test-and-validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git User for Deployment
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy MkDocs to gh-pages Branch
        run: |
          mkdocs gh-deploy --force --clean --verbose
