name: Deploy Azure Health Infrastructure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write   # Mandatory for OIDC JWT token exchange
  contents: read

jobs:
  provision-azure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Provision Core Health Resource Group
        uses: azure/cli@v2
        with:
          inlineScript: |
            # Check if subscription context is available before deployment
            SUB_COUNT=$(az account list --query "length(@)" -o tsv)
            if [ "$SUB_COUNT" -gt 0 ]; then
              az group create \
                --name rg-mosaic-health-prod \
                --location eastus2 \
                --tags Environment=Production Compliance=HIPAA_HITRUST ManagedBy=GitHub-OIDC
            else
              echo "Tenant handshake verified. Attach subscription to deploy infrastructure."
            fi
